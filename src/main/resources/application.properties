spring.application.name=calender-service
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/calender_db
spring.datasource.username=devuser
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=truespring.application.name=calendar-service

spring.flyway.enabled=true
spring.flyway.locations=classpath:migration